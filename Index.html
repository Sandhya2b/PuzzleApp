<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Puzzle App</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <div class="app">

        <h1>🧩 Puzzle Game</h1>

        <div class="info">
            <div>
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div>
                <span>Time</span>
                <strong id="timer">00:00</strong>
            </div>
        </div>

        <div id="board"></div>

        <button id="newGame">
            🔄 New Game
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
